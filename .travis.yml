language: python
addons:
  apt:
    packages:
    - zlib1g-dev
    - libncurses5-dev
python:
  - 3.8
  - 2.12
sudo: false
install:
  - source scripts/install_dependencies.sh
before_script:
  - pip install pytest pytest-cov
script:
  - "pip install ."
  - pytest --cov=circlator tests/
after_success:
  - coverage report
  - coverage xml
